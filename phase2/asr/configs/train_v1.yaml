lora_alpha: 32
lora_dropout: 0.05
gradient_checkpointing: true
max_audio_seconds: 30.0
snapshot_plan_hours:
  indicvoices_hi: 5.0
  mucs_hinglish: 5.0
  custom_min: 2.0
  custom_max: 5.0
